<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b2a3a" />
  <title>Campeonato de Pesca 🎣</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topo">
    <div class="topo-conteudo">
      <h1>🎣 Campeonato de Pesca</h1>
      <p class="subtitulo">Registre cada pesca e acompanhe a classificação em tempo real.</p>
    </div>
  </header>

  <!-- Abas -->
  <nav class="abas" role="tablist">
    <button class="aba ativa" data-aba="campeonato" role="tab">🏆 Campeonato</button>
    <button class="aba" data-aba="historico" role="tab">📜 Histórico</button>
  </nav>

  <main class="conteudo">
    <!-- Aba: Campeonato -->
    <section id="aba-campeonato" class="painel-aba">
      <div class="tabela-wrapper">
        <table class="tabela">
          <thead>
            <tr>
              <th>#</th>
              <th>Pescador</th>
              <th>Pescas</th>
              <th>Maior (cm)</th>
              <th>Peso total</th>
              <th>Pontos</th>
            </tr>
          </thead>
          <tbody id="ranking-corpo"></tbody>
        </table>
      </div>
    </section>

    <!-- Aba: Histórico -->
    <section id="aba-historico" class="painel-aba oculto">
      <div class="historico-cabecalho">
        <span id="contador-pescas" class="badge">0 pescas</span>
      </div>
      <div id="historico-lista" class="historico-lista"></div>
      <p id="vazio-historico" class="vazio">Nenhuma pesca registrada. Toque no botão + para começar.</p>
    </section>
  </main>

  <!-- Botão flutuante para adicionar pesca -->
  <button id="btn-adicionar" class="fab" aria-label="Adicionar pesca">+</button>

  <!-- Modal de nova pesca -->
  <div id="modal" class="modal oculto" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
    <div class="modal-caixa">
      <h2 id="modal-titulo">Nova pesca</h2>
      <form id="form-pesca">
        <label>
          Pescador
          <select id="campo-pescador" required></select>
        </label>

        <label>
          Peixe
          <select id="campo-tipo" required></select>
        </label>

        <!-- Aparece só quando "Cadastrar novo peixe" é escolhido -->
        <div id="bloco-novo-peixe" class="bloco-novo oculto">
          <label>
            Nome do novo peixe
            <input id="campo-novo-nome" type="text" placeholder="Ex.: Tucunaré" />
          </label>
          <label>
            Fator de pontuação
            <input id="campo-novo-fator" type="number" step="0.1" placeholder="Ex.: 4" />
          </label>
        </div>

        <label>
          Peso
          <span class="campo-com-unidade">
            <input id="campo-peso" type="number" min="0" step="0.01" required />
            <span class="toggle-unidade" role="group" aria-label="Unidade de peso">
              <button type="button" class="un ativa" data-un="kg">kg</button>
              <button type="button" class="un" data-un="g">g</button>
            </span>
          </span>
        </label>

        <label class="campo-slider">
          <span class="slider-topo">Tamanho <strong id="valor-tamanho">30 cm</strong></span>
          <input id="campo-tamanho" type="range" min="0" max="100" step="0.5" value="30" />
        </label>

        <label class="campo-foto">
          Foto <span class="opcional">(opcional)</span>
          <input id="campo-foto" type="file" accept="image/*" capture="environment" />
          <div id="foto-preview" class="foto-preview oculto">
            <img id="foto-preview-img" alt="Prévia da foto" />
            <button type="button" id="btn-remover-foto" class="btn-remover-foto">remover foto</button>
          </div>
        </label>

        <p class="preview">Pontuação estimada: <strong id="preview-pontuacao">0</strong></p>

        <div class="modal-acoes">
          <button type="button" id="btn-cancelar" class="btn btn-secundario">Cancelar</button>
          <button type="submit" class="btn btn-primario">Salvar pesca</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Lightbox de foto -->
  <div id="lightbox" class="lightbox oculto"><img id="lightbox-img" alt="Foto da pesca" /></div>

  <script src="app.js"></script>
</body>
</html>
